<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Catch 40 Statistik - Autodarts</title>
  <link rel="stylesheet" href="catch40.css">
</head>
<body>
  <div class="app">

    <header class="module-header">
      <h1>CATCH 40 STATISTIK</h1>
      <p class="subtitle">Highscores • Checkout-Quoten • Verlauf</p>

      <div class="header-actions">
        <button class="hdr-btn btn-home" onclick="window.location.href='catch40.html'">🎯 Zurück zum Spiel</button>
        <button class="hdr-btn btn-reset" onclick="resetStats()">🗑️ Statistik löschen</button>
        <a href="../index.html" class="hdr-btn btn-home">🏠 Startseite</a>
      </div>
    </header>

    <div id="history"></div>

  </div>

  <script>
    window.onload = () => {
        const container = document.getElementById("history");
        let history = JSON.parse(localStorage.getItem("catch40History") || "[]");

        if (history.length === 0) {
            container.innerHTML = "<div class='stat-card' style='color: #8ca1b3; margin-top: 30px;'>Noch keine Catch 40 Runde abgeschlossen.</div>";
            return;
        }

        // Nach Gesamtpunkten absteigend sortieren
        history.sort((a, b) => b.totalPoints - a.totalPoints);

        history.forEach((entry, index) => {
            const div = document.createElement("div");
            div.className = "stat-card";
            div.style.cssText = "margin-bottom: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;";

            div.innerHTML = `
                <div>
                    <div style="font-size: 13px; font-weight: 700; color: #00e5ff; margin-bottom: 4px;">
                        #${index + 1} — ${entry.date}
                    </div>
                    <div style="font-size: 24px; font-weight: 900; color: #ffffff;">${entry.totalPoints} <span style="font-size: 15px; color: #8ca1b3;">/ 120 Punkte</span></div>
                    <div style="font-size: 13px; color: #8ca1b3; margin-top: 6px;">
                        Gecheckt: <b style="color:#00ffa2;">${entry.checkedCount}/40 (${entry.checkoutRate}%)</b> • 
                        3 Pkt.: <b>${entry.count3}</b> • 2 Pkt.: <b>${entry.count2}</b> • 1 Pkt.: <b>${entry.count1}</b>
                    </div>
                </div>
                <div style="background: rgba(255,255,255,0.04); padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); text-align: right;">
                    <div style="font-size: 11px; color: #8ca1b3; font-weight: 600;">EINSTUFUNG</div>
                    <div style="font-size: 14px; font-weight: 800; color: #00ffa2; margin-top: 2px;">${entry.level}</div>
                </div>
            `;
            container.appendChild(div);
        });
    };

    function resetStats() {
        if (confirm("Wirklich alle Catch 40 Statistiken löschen?")) {
            localStorage.removeItem("catch40History");
            location.reload();
        }
    }
  </script>
</body>
</html>
