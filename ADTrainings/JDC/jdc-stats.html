<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>JDC Statistik - Autodarts</title>
  <link rel="stylesheet" href="jdc.css">
</head>

<body>
  <div class="app">

    <!-- Header im einheitlichen Hub-Design -->
    <header class="module-header">
      <h1>JDC STATISTIK</h1>
      <p class="subtitle">Highscores • Verlauf • JDC Challenge Historie</p>

      <div class="header-actions">
        <button class="hdr-btn btn-home" onclick="window.location.href='jdc.html'">Zurück zum Spiel</button>
        <button class="hdr-btn btn-reset" onclick="resetStats()">Statistik löschen</button>
        <a href="../index.html" class="hdr-btn btn-home">🏠 Startseite</a>
      </div>
    </header>

    <!-- Highscore & Verlauf Liste -->
    <div id="history"></div>

  </div>

  <script src="jdc.js"></script>
  <script>
    window.onload = () => {
        const container = document.getElementById("history");
        let history = JSON.parse(localStorage.getItem("jdcHistory") || "[]");

        if (history.length === 0) {
            container.innerHTML = "<div class='stat-card' style='color: #8ca1b3; margin-top: 30px;'>Noch keine JDC Challenge absolviert.</div>";
            return;
        }

        // Sortieren: Höchster Gesamtscore zuerst
        history.sort((a, b) => b.totalScore - a.totalScore);

        container.innerHTML = "";

        history.forEach((entry, index) => {
            const div = document.createElement("div");
            div.className = "stat-card";
            div.style.cssText = "margin-bottom: 16px; text-align: left; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;";

            div.innerHTML = `
                <div>
                    <div style="font-size: 13px; font-weight: 700; color: #00e5ff; margin-bottom: 4px;">#${index + 1} — ${entry.date}</div>
                    <div style="font-size: 24px; font-weight: 900; color: #ffffff;">${entry.totalScore} Punkte</div>
                    <div style="font-size: 13px; color: #8ca1b3; margin-top: 6px;">
                        Teil 1 (S10-15): <b style="color:#cbd5e1;">${entry.part1}</b> • 
                        Teil 2 (Doubles): <b style="color:#cbd5e1;">${entry.part2}</b> • 
                        Teil 3 (S15-20): <b style="color:#cbd5e1;">${entry.part3}</b>
                    </div>
                </div>
                <div style="background: rgba(255,255,255,0.04); padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); text-align: right;">
                    <div style="font-size: 11px; color: #8ca1b3; font-weight: 600;">SHIRT-STUFE</div>
                    <div style="font-size: 15px; font-weight: 800; color: #00ffa2; margin-top: 2px;">${entry.shirt}</div>
                </div>
            `;
            container.appendChild(div);
        });
    };

    function resetStats() {
        if (confirm("Willst du wirklich ALLE JDC Statistikdaten unwiderruflich löschen?")) {
            localStorage.removeItem("jdcHistory");
            location.reload();
        }
    }
  </script>
</body>
</html>
